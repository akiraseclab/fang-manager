<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>注册房东</title>
<style>
  :root {
    --bg:#f6f6f4; --surface:#ffffff;
    --ink:#1f1e1a; --ink-2:rgba(31,30,26,.64); --ink-3:rgba(31,30,26,.44);
    --brand:#146c43; --brand-deep:#0f5a37; --brand-soft:#e7f1eb;
    --shadow:0 1px 2px rgba(31,30,26,.05), 0 10px 30px rgba(31,30,26,.07);
    --ease:cubic-bezier(.16,1,.3,1);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { color-scheme:light; }
  body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
  button, input { font-family:inherit; }
  button:focus-visible, input:focus-visible { outline:2px solid var(--brand); outline-offset:2px; }
  .card { background:var(--surface); border-radius:20px; box-shadow:var(--shadow); width:100%; max-width:380px; padding:40px 32px 30px; }
  h1 { font-size:21px; font-weight:800; letter-spacing:-.3px; }
  .sub { font-size:13px; color:var(--ink-3); margin-top:7px; }
  .err { background:#fdeceb; color:#d9382e; font-size:13px; border-radius:12px; padding:10px 14px; margin:20px 0 0; }
  .field { margin-top:16px; text-align:left; }
  .field label { display:block; font-size:13px; font-weight:500; color:var(--ink-2); margin-bottom:6px; }
  .field input { width:100%; height:46px; border:1px solid rgba(31,30,26,.14); border-radius:12px; background:#faf9f6; font-size:16px; color:var(--ink); padding:0 16px; transition:border-color .2s, background .2s; }
  .field input:focus { border-color:var(--brand); outline:none; background:#fff; }
  .hint { font-size:12px; color:var(--ink-3); margin-top:5px; }
  .submit { width:100%; height:50px; border:none; border-radius:999px; background:var(--brand); color:#fff; font-size:16px; font-weight:600; cursor:pointer; margin-top:26px; transition:transform .2s var(--ease), background .2s; }
  .submit:hover { background:var(--brand-deep); }
  .submit:active { transform:scale(.98); }
  .foot { font-size:13px; color:var(--ink-3); margin-top:22px; }
  .foot a { color:var(--brand); font-weight:600; text-decoration:none; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<div class="card">
  <h1>注册房东</h1>
  <p class="sub">注册后即可上架房源、生成二维码</p>

  {% if error %}<div class="err">{{ error }}</div>{% endif %}

  <form method="post">
    <div class="field">
      <label>姓名</label>
      <input name="name" placeholder="租客看到的称呼" required>
    </div>
    <div class="field">
      <label>手机号（登录账号）</label>
      <input type="tel" name="phone" placeholder="用于登录" required>
    </div>
    <div class="field">
      <label>微信号（选填）</label>
      <input name="wechat_id" placeholder="租客可复制添加你">
      <div class="hint">也可以稍后在个人资料中填写</div>
    </div>
    <div class="field">
      <label>设置密码</label>
      <input type="password" name="password" placeholder="至少 6 位" required minlength="6">
    </div>
    <button type="submit" class="submit">注册并进入</button>
  </form>

  <p class="foot">已有账号？<a href="{{ url_for('login') }}">直接登录</a></p>
</div>

</body>
</html>
